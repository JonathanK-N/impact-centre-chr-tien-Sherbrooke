{% extends "admin/layout.html" %}

{% block admin_body %}
<div class="card border-0 shadow-sm">
    <div class="card-header bg-transparent">
        <h2 class="h5 mb-0">Créer une annonce</h2>
    </div>
    <div class="card-body">
        <form method="post" class="row g-4">
            <div class="col-md-6">
                <label class="form-label">Titre *</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Type</label>
                <select class="form-select" name="announcement_type">
                    <option value="General">Général</option>
                    <option value="Department">Département</option>
                    <option value="Family">Famille d'Impact</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Priorité</label>
                <select class="form-select" name="priority">
                    <option value="Low">Basse</option>
                    <option value="Normal" selected>Normale</option>
                    <option value="High">Haute</option>
                    <option value="Urgent">Urgente</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Département ciblé</label>
                <select class="form-select" name="target_department_id">
                    <option value="">Aucun</option>
                    {% for department in departments %}
                    <option value="{{ department.id }}">{{ department.name }}</option>
                    {% endfor %}
                </select>
                <small class="text-muted">Utilisé uniquement pour les annonces de type "Département".</small>
            </div>
            <div class="col-md-6">
                <label class="form-label">Famille ciblée</label>
                <select class="form-select" name="target_family_id">
                    <option value="">Aucune</option>
                    {% for family in families %}
                    <option value="{{ family.id }}">{{ family.name }}</option>
                    {% endfor %}
                </select>
                <small class="text-muted">Utilisé uniquement pour les annonces "Famille".</small>
            </div>
            <div class="col-12">
                <label class="form-label">Message *</label>
                <textarea class="form-control" name="content" rows="5" required></textarea>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="1" id="is_pinned" name="is_pinned">
                    <label class="form-check-label" for="is_pinned">
                        Épingler en haut de la liste
                    </label>
                </div>
            </div>
            <div class="col-12 d-flex justify-content-end gap-2">
                <a href="{{ url_for('admin.announcements') }}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-brand-gradient">
                    <i class="bi bi-megaphone me-1"></i>Publier
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
