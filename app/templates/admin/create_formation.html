{% extends "base.html" %}

{% block title %}Créer une Formation - Administration{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="bi bi-mortarboard me-2"></i>
                        Créer une nouvelle formation
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Titre de la formation *</label>
                                    <input type="text" class="form-control" id="title" name="title" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="code" class="form-label">Code</label>
                                    <input type="text" class="form-control" id="code" name="code" placeholder="PCNC-001">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="category" class="form-label">Catégorie *</label>
                                    <select class="form-select" id="category" name="category" required>
                                        <option value="">Sélectionner une catégorie</option>
                                        <option value="PCNC">PCNC</option>
                                        <option value="BAPTEME">Baptême</option>
                                        <option value="ATELIER">Atelier</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="duration_total" class="form-label">Durée totale (minutes)</label>
                                    <input type="number" class="form-control" id="duration_total" name="duration_total" min="1">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="thumbnail_url" class="form-label">URL de la miniature</label>
                            <input type="url" class="form-control" id="thumbnail_url" name="thumbnail_url" 
                                   placeholder="https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg">
                        </div>

                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            Après avoir créé la formation, vous pourrez ajouter les modules vidéo individuellement.
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('admin.formations') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Créer la formation
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
